<!DOCTYPE html>
<html lang="en" data-theme="electronics">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Manager | WILL'S BLOG</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #030712;
      --surface:    rgba(15, 23, 42, 0.72);
      --surface-2:  rgba(15, 23, 42, 0.92);
      --border:     rgba(34, 211, 238, 0.12);
      --accent:     #22d3ee;
      --accent-dim: rgba(34, 211, 238, 0.15);
      --text:       #e2e8f0;
      --text-muted: #94a3b8;
      --danger:     #f87171;
      --danger-dim: rgba(248, 113, 113, 0.15);
      --success:    #4ade80;
      --radius:     12px;
      --font:       'Outfit', system-ui, sans-serif;
      --blur:       blur(18px) saturate(1.5);
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 10% -10%, rgba(34,211,238,.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 90%,  rgba(56,189,248,.06) 0%, transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .page { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    header .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 1.2rem; font-weight: 700; color: #0f172a;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header .subtitle { font-size: 0.8rem; color: var(--text-muted); }
    header a {
      margin-left: auto;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color .2s;
    }
    header a:hover { color: var(--accent); }

    /* ── Glass card ─────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      padding: 1.5rem;
    }

    /* ── Auth gate ──────────────────────────────────────────────────── */
    #authGate {
      max-width: 420px;
      margin: 8vh auto 0;
    }
    #authGate h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    #authGate p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; }

    .input-group { display: flex; gap: .6rem; }
    .input-group input {
      flex: 1;
      background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem .9rem;
      color: var(--text);
      font-family: var(--font);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    .input-group input:focus { border-color: var(--accent); }

    button {
      cursor: pointer;
      font-family: var(--font);
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 500;
      transition: opacity .15s, transform .1s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      padding: .6rem 1.2rem;
    }
    .btn-primary:hover:not(:disabled) { opacity: .88; }

    .btn-danger {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(248,113,113,.25);
      padding: .35rem .7rem;
      font-size: .78rem;
    }
    .btn-danger:hover:not(:disabled) { background: rgba(248,113,113,.25); }

    .btn-ghost {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(34,211,238,.2);
      padding: .35rem .7rem;
      font-size: .78rem;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(34,211,238,.25); }

    /* ── Manager layout ─────────────────────────────────────────────── */
    #manager { display: none; }
    #manager.visible { display: block; }

    .section-title {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: .8rem;
    }

    /* ── Drop zone ──────────────────────────────────────────────────── */
    #dropZone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 1.5rem;
      position: relative;
    }
    #dropZone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    #dropZone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-icon { font-size: 2.2rem; margin-bottom: .5rem; }
    .drop-label { font-size: .95rem; color: var(--text-muted); }
    .drop-sub { font-size: .75rem; color: var(--text-muted); margin-top: .3rem; opacity: .7; }

    /* ── Upload progress ────────────────────────────────────────────── */
    #uploadQueue { margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
    .upload-item {
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem .9rem;
      font-size: .83rem;
      display: flex; align-items: center; gap: .7rem;
    }
    .upload-item .filename { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upload-item .status { font-size: .78rem; color: var(--text-muted); }
    .upload-item.ok .status { color: var(--success); }
    .upload-item.err .status { color: var(--danger); }

    /* ── Image grid ─────────────────────────────────────────────────── */
    #imageGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .img-card {
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color .2s, transform .2s;
    }
    .img-card:hover { border-color: rgba(34,211,238,.3); transform: translateY(-2px); }

    .img-preview {
      height: 150px;
      background: rgba(0,0,0,.4);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .img-preview img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .3s;
    }
    .img-card:hover .img-preview img { transform: scale(1.04); }
    .img-preview .no-preview { font-size: 2.5rem; }

    .img-meta {
      padding: .75rem;
      flex: 1; display: flex; flex-direction: column; gap: .4rem;
    }
    .img-key {
      font-size: .82rem; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .img-size { font-size: .72rem; color: var(--text-muted); }

    .img-actions { display: flex; gap: .4rem; flex-wrap: wrap; }

    /* ── Copied toast ────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(120%);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-size: .85rem;
      backdrop-filter: var(--blur);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Status bar ─────────────────────────────────────────────────── */
    #statusBar {
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: .6rem;
    }
    #statusBar .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    #statusBar.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toolbar ─────────────────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .toolbar .count {
      margin-left: auto;
      font-size: .8rem; color: var(--text-muted);
    }

    /* ── Error message ──────────────────────────────────────────────── */
    .err-msg {
      background: var(--danger-dim);
      border: 1px solid rgba(248,113,113,.3);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .85rem;
      color: var(--danger);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">📸</div>
      <div>
        <h1>Image Manager</h1>
        <div class="subtitle">Cloudflare R2 Storage</div>
      </div>
      <a href="/">← Back to blog</a>
    </header>

    <!-- Auth gate -->
    <div id="authGate" class="card">
      <h2>🔐 Enter your secret</h2>
      <p>Enter the <code>IMAGES_SECRET</code> you configured to manage images.</p>
      <div class="input-group">
        <input id="tokenInput" type="password" placeholder="Bearer token…" autocomplete="current-password" />
        <button class="btn-primary" id="authBtn">Unlock</button>
      </div>
      <div id="authError" class="err-msg" style="display:none; margin-top: .8rem;"></div>
    </div>

    <!-- Image manager (shown after auth) -->
    <div id="manager">
      <!-- Upload area -->
      <div class="card" style="margin-bottom:1.5rem;">
        <div class="section-title">Upload Images</div>

        <div id="dropZone">
          <input type="file" id="fileInput" accept="image/*" multiple />
          <div class="drop-icon">🖼️</div>
          <div class="drop-label">Drop images here or click to browse</div>
          <div class="drop-sub">JPEG, PNG, WebP, GIF, AVIF, SVG — up to 25 MB each</div>
        </div>

        <div id="uploadQueue"></div>
      </div>

      <!-- Gallery -->
      <div class="card">
        <div class="toolbar">
          <div class="section-title" style="margin:0;">Uploaded Images</div>
          <button class="btn-ghost" id="refreshBtn">↻ Refresh</button>
          <div class="count" id="imgCount"></div>
        </div>

        <div id="statusBar">
          <div class="spinner"></div>
          <span id="statusText">Loading…</span>
        </div>

        <div id="errorMsg" class="err-msg" style="display:none;"></div>
        <div id="imageGrid"></div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let authToken = sessionStorage.getItem('img_token') || '';

    // ── Auth ────────────────────────────────────────────────────────
    if (authToken) tryAuth(authToken);

    $('tokenInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('authBtn').click();
    });

    $('authBtn').addEventListener('click', () => {
      const token = $('tokenInput').value.trim();
      if (!token) return;
      tryAuth(token);
    });

    async function tryAuth(token) {
      $('authBtn').disabled = true;
      $('authError').style.display = 'none';
      try {
        const res = await fetch('/api/images', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) {
          showAuthError('Invalid secret. Try again.');
          sessionStorage.removeItem('img_token');
          authToken = '';
          return;
        }
        authToken = token;
        sessionStorage.setItem('img_token', token);
        $('authGate').style.display = 'none';
        $('manager').classList.add('visible');
        await loadImages();
      } catch (e) {
        showAuthError('Could not reach the API. Is the worker running?');
      } finally {
        $('authBtn').disabled = false;
      }
    }

    function showAuthError(msg) {
      $('authError').textContent = msg;
      $('authError').style.display = 'block';
    }

    // ── Image listing ───────────────────────────────────────────────
    $('refreshBtn').addEventListener('click', loadImages);

    async function loadImages() {
      setStatus(true, 'Loading images…');
      $('errorMsg').style.display = 'none';
      $('imageGrid').innerHTML = '';
      try {
        const res = await fetch('/api/images', { headers: authHeaders() });
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        renderGallery(data.images);
        $('imgCount').textContent = `${data.count} image${data.count !== 1 ? 's' : ''}`;
        setStatus(false, '');
      } catch (e) {
        showError(e.message);
        setStatus(false, '');
      }
    }

    function renderGallery(images) {
      const grid = $('imageGrid');
      grid.innerHTML = '';
      if (!images.length) {
        grid.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">No images uploaded yet.</p>';
        return;
      }
      const previewable = new Set(['image/jpeg','image/jpg','image/png','image/gif','image/webp','image/svg+xml','image/avif']);
      images.forEach((img) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        const ext = img.key.split('.').pop().toLowerCase();
        const isPreviewable = ['jpg','jpeg','png','gif','webp','svg','avif'].includes(ext);

        card.innerHTML = `
          <div class="img-preview">
            ${isPreviewable
              ? `<img src="${img.url}" alt="${esc(img.key)}" loading="lazy" onerror="this.parentNode.innerHTML='<span class=no-preview>📄</span>'" />`
              : `<span class="no-preview">📄</span>`}
          </div>
          <div class="img-meta">
            <div class="img-key" title="${esc(img.key)}">${esc(img.key)}</div>
            <div class="img-size">${formatSize(img.size)}</div>
            <div class="img-actions">
              <button class="btn-ghost copy-md-btn" data-md="${esc(img.markdown)}" title="Copy markdown">📋 Copy MD</button>
              <button class="btn-ghost copy-url-btn" data-url="${esc(img.url)}" title="Copy URL">🔗 URL</button>
              <button class="btn-danger del-btn" data-key="${esc(img.key)}" title="Delete">🗑</button>
            </div>
          </div>`;
        grid.appendChild(card);
      });

      // Wire up action buttons
      grid.querySelectorAll('.copy-md-btn').forEach((btn) => {
        btn.addEventListener('click', () => copyText(btn.dataset.md, 'Markdown copied!'));
      });
      grid.querySelectorAll('.copy-url-btn').forEach((btn) => {
        btn.addEventListener('click', () => copyText(btn.dataset.url, 'URL copied!'));
      });
      grid.querySelectorAll('.del-btn').forEach((btn) => {
        btn.addEventListener('click', () => deleteImage(btn.dataset.key, btn));
      });
    }

    // ── Upload ──────────────────────────────────────────────────────
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      uploadFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', () => {
      uploadFiles(Array.from(fileInput.files));
      fileInput.value = '';
    });

    async function uploadFiles(files) {
      if (!files.length) return;
      for (const file of files) {
        await uploadOne(file);
      }
      await loadImages();
    }

    async function uploadOne(file) {
      const item = addQueueItem(file.name);
      try {
        const form = new FormData();
        form.append('file', file);
        const res = await fetch('/api/images', {
          method: 'POST',
          headers: authHeaders(),
          body: form,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        item.classList.add('ok');
        item.querySelector('.status').textContent = `✓ Uploaded (${formatSize(data.size)})`;
        setTimeout(() => item.remove(), 3000);
      } catch (e) {
        item.classList.add('err');
        item.querySelector('.status').textContent = `✗ ${e.message}`;
      }
    }

    function addQueueItem(name) {
      const el = document.createElement('div');
      el.className = 'upload-item';
      el.innerHTML = `<span class="filename">${esc(name)}</span><span class="status">Uploading…</span>`;
      $('uploadQueue').prepend(el);
      return el;
    }

    // ── Delete ──────────────────────────────────────────────────────
    async function deleteImage(key, btn) {
      if (!confirm(`Delete "${key}"? This cannot be undone.`)) return;
      btn.disabled = true;
      try {
        const res = await fetch(`/api/images/${encodeURIComponent(key)}`, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        if (!res.ok) {
          const d = await res.json();
          throw new Error(d.error || res.status);
        }
        toast('Deleted!');
        await loadImages();
      } catch (e) {
        showError(`Delete failed: ${e.message}`);
        btn.disabled = false;
      }
    }

    // ── Helpers ─────────────────────────────────────────────────────
    function authHeaders() {
      return { 'Authorization': `Bearer ${authToken}` };
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function setStatus(loading, text) {
      const bar = $('statusBar');
      bar.classList.toggle('loading', loading);
      $('statusText').textContent = text;
      bar.style.display = (loading || text) ? '' : 'none';
    }

    function showError(msg) {
      const el = $('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    let toastTimer;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    async function copyText(text, successMsg) {
      try {
        await navigator.clipboard.writeText(text);
        toast(successMsg);
      } catch {
        prompt('Copy this:', text);
      }
    }

    setStatus(false, '');
  </script>
</body>
</html>
